name: Bug report
description: Report a reproducible Scorecaster problem without sharing secrets or personal data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include passwords, access tokens, recovery links, API keys, payment information or another user's data. Security vulnerabilities belong in private vulnerability reporting, not this form.
  - type: dropdown
    id: product
    attributes:
      label: Product area
      options:
        - iOS mobile app
        - Android mobile app
        - Web app
        - Authentication and account
        - Paper tracking
        - Odds and Top Picks
        - Data export or account deletion
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "Example: mobile 1.0.0 or commit SHA"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Device and operating system
      placeholder: "Example: iPhone 15, iOS 26.5"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use test data only and redact identifiers.
      placeholder: |
        1. Open ...
        2. Tap ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I removed passwords, tokens, API keys, personal data and private paper-pick history from this report.
          required: true
        - label: This is not an exploitable security vulnerability.
          required: true
