name: Scorecaster Autonomous Risk Parity Bootstrap

on:
  push:
    branches: [agent/autonomous-risk-profile-v1]

permissions:
  contents: write

jobs:
  patch-parity:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/autonomous-risk-profile-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic parity patch
        run: node scripts/apply-autonomous-risk-parity-patch.mjs
      - name: Install mobile dependencies
        run: npm --prefix mobile install --no-audit --no-fund --silent
      - name: Focused autonomous risk tests
        run: node --test scripts/autonomous-risk-profile-v1.test.mjs
      - name: Mobile TypeScript
        run: npm --prefix mobile run typecheck
      - name: Remove one-time bootstrap files
        run: rm .github/workflows/autonomous-risk-parity-bootstrap.yml scripts/apply-autonomous-risk-parity-patch.mjs
      - name: Commit parity changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Expose autonomous risk profile across mobile and export"
          git push origin HEAD:agent/autonomous-risk-profile-v1
