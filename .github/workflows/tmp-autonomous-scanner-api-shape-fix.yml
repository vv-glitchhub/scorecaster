name: Temporary Autonomous Scanner API Shape Fix

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/autonomous-market-scanner-v1
          fetch-depth: 0
      - name: Patch API envelope handling and regression
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path('lib/autonomous-market-scanner-v1.mjs')
          text = module.read_text()
          text = text.replace(
              'async function defaultMarketLoader({ origin, sportKey, eventId: id, group, fetchImpl = fetch }) {',
              'export async function loadAutonomousMarketUniverseGroup({ origin, sportKey, eventId: id, group, fetchImpl = fetch }) {'
          )
          text = text.replace(
              '    payload,\n    requestsRemaining: finite(payload?.providerHeaders?.requestsRemaining, null),',
              '    payload: payload?.data || null,\n    requestsRemaining: finite(payload?.providerHeaders?.requestsRemaining, null),'
          )
          text = text.replace(
              '  marketLoader = defaultMarketLoader,',
              '  marketLoader = loadAutonomousMarketUniverseGroup,'
          )
          module.write_text(text)

          test = Path('scripts/autonomous-market-scanner-v1.test.mjs')
          source = test.read_text()
          source = source.replace(
              '  marketUniverseSelectionToAgentCandidate,\n  mergeAutonomousMarketCandidates,',
              '  marketUniverseSelectionToAgentCandidate,\n  loadAutonomousMarketUniverseGroup,\n  mergeAutonomousMarketCandidates,'
          )
          anchor = 'assert.equal(priceOnly, null);\n\nconst mockUniverse = {'
          regression = '''assert.equal(priceOnly, null);\n\nconst envelopeLoad = await loadAutonomousMarketUniverseGroup({\n  origin: "https://scorecaster.vercel.app",\n  sportKey: "soccer_epl",\n  eventId: "evt-envelope",\n  group: "goals",\n  fetchImpl: async () => new Response(JSON.stringify({\n    ok: true,\n    providerHeaders: { requestsRemaining: "777", requestsUsed: "23" },\n    data: { event: { id: "evt-envelope" }, markets: [] }\n  }), { status: 200, headers: { "content-type": "application/json" } })\n});\nassert.equal(envelopeLoad.ok, true);\nassert.equal(envelopeLoad.payload.event.id, "evt-envelope");\nassert.equal(envelopeLoad.requestsRemaining, 777);\nassert.equal(envelopeLoad.requestsUsed, 23);\n\nconst mockUniverse = {'''
          if anchor not in source:
              raise SystemExit('test anchor missing')
          source = source.replace(anchor, regression, 1)
          test.write_text(source)

          self_path = Path('.github/workflows/tmp-autonomous-scanner-api-shape-fix.yml')
          if self_path.exists():
              self_path.unlink()
          PY
      - name: Commit fix
        run: |
          git config user.name "scorecaster-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Unwrap Market Universe API envelope in scanner"
          git push origin HEAD:agent/autonomous-market-scanner-v1
