name: Scorecaster Freshness-Aware Worker Chain V2

on:
  pull_request:
    paths:
      - "lib/unified-capture-freshness-v1.mjs"
      - "app/api/unified-data/freshness/route.js"
      - ".github/workflows/collector.yml"
      - ".github/workflows/unified-data-capture.yml"
      - "scripts/freshness-aware-worker-chain-v2.test.mjs"
      - ".github/workflows/freshness-aware-worker-chain-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Freshness-aware worker chain regression
        run: node --test scripts/freshness-aware-worker-chain-v2.test.mjs
