name: Scorecaster Vercel Deployment Policy V1

on:
  pull_request:
    paths:
      - "vercel.json"
      - "lib/vercel-build-policy-v1.mjs"
      - "scripts/vercel-ignore-build.mjs"
      - "scripts/vercel-build-policy-v1.test.mjs"
      - "docs/VERCEL_DEPLOYMENT_POLICY_V1.md"
      - ".github/workflows/vercel-deployment-policy-v1.yml"
  push:
    branches: [main]
    paths:
      - "vercel.json"
      - "lib/vercel-build-policy-v1.mjs"
      - "scripts/vercel-ignore-build.mjs"
      - "scripts/vercel-build-policy-v1.test.mjs"
      - "docs/VERCEL_DEPLOYMENT_POLICY_V1.md"
      - ".github/workflows/vercel-deployment-policy-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify preview/production ignore semantics
        run: node --test scripts/vercel-build-policy-v1.test.mjs

      - name: Verify production build is never ignored
        env:
          VERCEL_ENV: production
        run: |
          set +e
          node scripts/vercel-ignore-build.mjs
          status=$?
          set -e
          test "$status" -eq 1

      - name: Verify preview build is ignored
        env:
          VERCEL_ENV: preview
        run: node scripts/vercel-ignore-build.mjs
