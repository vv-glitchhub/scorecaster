name: Scorecaster Vercel Deployment Policy V3

on:
  pull_request:
    paths:
      - "vercel.json"
      - "scripts/vercel-deployment-policy-v3.test.mjs"
      - "docs/VERCEL_DEPLOYMENT_POLICY_V3.md"
      - ".github/workflows/vercel-deployment-policy-v1.yml"
  push:
    branches: [main]
    paths:
      - "vercel.json"
      - "scripts/vercel-deployment-policy-v3.test.mjs"
      - "docs/VERCEL_DEPLOYMENT_POLICY_V3.md"
      - ".github/workflows/vercel-deployment-policy-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify recursive Git-stage deployment policy
        run: node --test scripts/vercel-deployment-policy-v3.test.mjs

      - name: Verify obsolete preview mechanisms and single-star default are absent
        run: |
          test ! -f scripts/vercel-ignore-build.mjs
          test ! -f lib/vercel-build-policy-v1.mjs
          test ! -f scripts/vercel-deployment-policy-v2.test.mjs
          node -e 'const c=require("./vercel.json"); if (Object.prototype.hasOwnProperty.call(c,"ignoreCommand")) process.exit(1); if(c.git?.deploymentEnabled?.["**"]!==false||c.git?.deploymentEnabled?.main!==true) process.exit(1); if(Object.prototype.hasOwnProperty.call(c.git?.deploymentEnabled||{},"*")) process.exit(1)'
