name: Scorecaster Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - "scripts/mobile-auto-watch.test.mjs"
      - ".github/workflows/mobile-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/**"
      - "scripts/mobile-auto-watch.test.mjs"
      - ".github/workflows/mobile-ci.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1

      - name: Install mobile dependencies
        run: npm install --no-audit --no-fund --silent

      - name: Native Auto-Watch regression tests
        working-directory: .
        run: node --test scripts/mobile-auto-watch.test.mjs

      - name: Audit store and release configuration
        run: |
          set -o pipefail
          npm run release:audit 2>&1 | tee release-audit.log

      - name: Check Expo dependency compatibility
        run: npm run check:expo

      - name: Typecheck
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck.log

      - name: Upload mobile diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecaster-mobile-diagnostics-${{ github.run_id }}
          path: |
            mobile/release-audit.log
            mobile/typecheck.log
          if-no-files-found: ignore
          retention-days: 7
