name: Scorecaster Autonomous Risk Profile V1

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  autonomous-risk-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Autonomous risk-profile regression
        run: node --test scripts/autonomous-risk-profile-v1.test.mjs
