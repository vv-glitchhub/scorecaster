name: Scorecaster Context Engine V1

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  context-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: https://scorecaster-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_scorecaster_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --silent

      - name: Context Engine regression tests
        run: node --test scripts/context-engine-v1.test.mjs

      - name: Migration inventory regression tests
        run: node --test scripts/migration-inventory.test.mjs

      - name: Secret and repository security check
        run: npm run security:check

      - name: Production build
        run: npm run build
