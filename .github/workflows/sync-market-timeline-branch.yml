name: Sync Market Timeline Branch

on:
  push:
    branches:
      - feature/market-timeline-v1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-main:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/market-timeline-v1

      - name: Merge main with bounded conflict resolution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main

          cp app/api/account/route.js /tmp/account-route.js
          cp app/api/cloud/watchlist/route.js /tmp/watchlist-route.js

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            unexpected="$(printf '%s\n' "$conflicts" | grep -Ev '^(app/api/account/route.js|app/api/cloud/watchlist/route.js)$' || true)"
            if [ -n "$unexpected" ]; then
              echo "Unexpected merge conflicts:"
              echo "$unexpected"
              git merge --abort
              exit 1
            fi
            cp /tmp/account-route.js app/api/account/route.js
            cp /tmp/watchlist-route.js app/api/cloud/watchlist/route.js
            git add app/api/account/route.js app/api/cloud/watchlist/route.js
          fi

          if git diff --cached --quiet; then
            echo "Branch already contains main."
            exit 0
          fi

          git commit -m "Merge main into Market Timeline V1"
          git push origin HEAD:feature/market-timeline-v1
