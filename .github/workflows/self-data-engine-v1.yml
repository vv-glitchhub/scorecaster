name: Self Data Engine V1

on:
  push:
    branches: [main]
    paths:
      - "lib/self-data-engine-v1.mjs"
      - "app/api/internal/self-data-engine/**"
      - "app/api/self-data-engine/**"
      - "app/api/cron/update-ratings/**"
      - "scripts/self-data-engine-v1.test.mjs"
      - "supabase/scorecaster_self_data_engine_v1.sql"
      - ".github/workflows/self-data-engine-v1.yml"
  pull_request:
    paths:
      - "lib/self-data-engine-v1.mjs"
      - "app/api/internal/self-data-engine/**"
      - "app/api/self-data-engine/**"
      - "app/api/cron/update-ratings/**"
      - "scripts/self-data-engine-v1.test.mjs"
      - "supabase/scorecaster_self_data_engine_v1.sql"
      - ".github/workflows/self-data-engine-v1.yml"
  schedule:
    - cron: "15 1,7,13,19 * * *"
  workflow_dispatch:

jobs:
  verify:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Point-in-time and safety regressions
        run: node scripts/self-data-engine-v1.test.mjs
      - name: Production build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: local-ci-placeholder
        run: npm run build

  production-capture:
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for exact production commit
        if: github.event_name == 'push'
        env:
          TARGET_SHA: ${{ github.sha }}
          PRODUCTION_BASE_URL: https://scorecaster.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            observed="$(curl --silent --show-error --max-time 15 "${PRODUCTION_BASE_URL}/api/health" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' 2>/dev/null || true)"
            if [[ "$observed" == "$TARGET_SHA" ]]; then
              echo "Exact production commit is live: ${TARGET_SHA:0:8}"
              exit 0
            fi
            echo "Waiting for production target=${TARGET_SHA:0:8} observed=${observed:0:8}"
            sleep 15
          done
          echo "Production did not reach the exact target commit in time" >&2
          exit 1

      - name: Invoke protected production Self Data Engine
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PRODUCTION_BASE_URL: https://scorecaster.vercel.app
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CRON_SECRET:-}" ]]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi

          report="$RUNNER_TEMP/self-data-engine-response.json"
          http_code="$(curl --silent --show-error --max-time 150 --retry 2 --retry-delay 5 \
            --output "$report" \
            --write-out "%{http_code}" \
            --header "Accept: application/json" \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "${PRODUCTION_BASE_URL}/api/internal/self-data-engine")"

          HTTP_CODE="$http_code" REPORT_PATH="$report" node <<'NODE'
          const fs = require('node:fs');
          const code = Number(process.env.HTTP_CODE || 0);
          let payload = null;
          try { payload = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8')); } catch {}
          const safe = {
            httpStatus: code,
            ok: payload?.ok === true,
            version: payload?.version || null,
            status: payload?.status || null,
            eventsSeen: payload?.eventsSeen ?? null,
            featureSnapshots: payload?.featureSnapshots ?? null,
            decisionsWritten: payload?.decisionsWritten ?? null,
            eligibleForModel: payload?.eligibleForModel ?? null,
            leakageGuardPassed: payload?.leakageGuardPassed ?? null,
            paperOnly: payload?.paperOnly ?? null,
            realMoneyActionAvailable: payload?.realMoneyActionAvailable ?? null,
            productionProbabilityChanged: payload?.productionProbabilityChanged ?? null,
          };
          console.log(JSON.stringify(safe));
          if (code !== 200 || payload?.ok !== true || payload?.paperOnly !== true || payload?.realMoneyActionAvailable !== false || payload?.productionProbabilityChanged !== false) {
            process.exit(1);
          }
          NODE
