name: WP91 Patch Migration Checks

on:
  push:
    branches:
      - feature/production-migration-inventory-v1
    paths:
      - .github/workflows/wp91-code-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-migration-inventory-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update migration checks and scripts
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";

          async function replace(path, edits) {
            let source = await readFile(path, "utf8");
            for (const [before, after] of edits) {
              if (!source.includes(before)) throw new Error(`${path}: missing replacement token ${before}`);
              source = source.replace(before, after);
            }
            await writeFile(path, source, "utf8");
          }

          await replace("scripts/production-activation.mjs", [
            ["migrations.length >= 19", "migrations.length >= 21"]
          ]);

          await replace("scripts/release-readiness.mjs", [
            ["migrations.length >= 18", "migrations.length >= 21"],
            [
              "const unifiedDataIndex = migrations.indexOf(\"supabase/scorecaster_unified_data.sql\");",
              "const communityFeedIndex = migrations.indexOf(\"supabase/scorecaster_community_feed_v1.sql\");\nconst aiIntelligenceIndex = migrations.indexOf(\"supabase/scorecaster_ai_intelligence_v1.sql\");\nconst collectorIndex = migrations.indexOf(\"supabase/scorecaster_collector_v1.sql\");\nconst unifiedDataIndex = migrations.indexOf(\"supabase/scorecaster_unified_data.sql\");"
            ],
            [
              "check(unifiedDataIndex >= 0, \"Unified Data migration must be listed\");",
              "check(communityFeedIndex === 2, \"Community Feed must run immediately after Cloud Auth\");\ncheck(aiIntelligenceIndex === collectorIndex + 1, \"AI Intelligence must run immediately after Collector V1\");\ncheck(unifiedDataIndex === aiIntelligenceIndex + 1, \"Unified Data must run immediately after AI Intelligence\");"
            ]
          ]);

          await replace("scripts/release-readiness.test.mjs", [
            ["manifest.supabaseMigrations.length, 19", "manifest.supabaseMigrations.length, 21"],
            [
              "assert.ok(manifest.supabaseMigrations.includes(\"supabase/scorecaster_collector_v1.sql\"));",
              "assert.ok(manifest.supabaseMigrations.includes(\"supabase/scorecaster_collector_v1.sql\"));\n  assert.ok(manifest.supabaseMigrations.includes(\"supabase/scorecaster_community_feed_v1.sql\"));\n  assert.ok(manifest.supabaseMigrations.includes(\"supabase/scorecaster_ai_intelligence_v1.sql\"));"
            ],
            [
              "\"scorecaster_sports_analytics.sql\",",
              "\"scorecaster_community_feed_v1.sql\",\n    \"scorecaster_ai_intelligence_v1.sql\",\n    \"scorecaster_sports_analytics.sql\","
            ]
          ]);

          await replace("scripts/production-activation.test.mjs", [
            ["manifest.supabaseMigrations.length, 19", "manifest.supabaseMigrations.length, 21"],
            ["migrations\\.length >= 19", "migrations\\.length >= 21"],
            [
              "assert.ok(manifest.supabaseMigrations.includes(\"supabase/scorecaster_collector_v1.sql\"));",
              "assert.ok(manifest.supabaseMigrations.includes(\"supabase/scorecaster_collector_v1.sql\"));\n  assert.ok(manifest.supabaseMigrations.includes(\"supabase/scorecaster_community_feed_v1.sql\"));\n  assert.ok(manifest.supabaseMigrations.includes(\"supabase/scorecaster_ai_intelligence_v1.sql\"));"
            ]
          ]);

          const packagePath = "package.json";
          const packageJson = JSON.parse(await readFile(packagePath, "utf8"));
          packageJson.scripts["migration:inventory"] = "node scripts/migration-inventory.mjs --check --write";
          packageJson.scripts["test:migration-inventory"] = "node --test scripts/migration-inventory.test.mjs";
          packageJson.scripts.test = packageJson.scripts.test.replace(
            "npm run test:production-activation &&",
            "npm run test:production-activation && npm run test:migration-inventory &&"
          );
          await writeFile(packagePath, `${JSON.stringify(packageJson, null, 2)}\n`, "utf8");
          NODE
      - name: Commit check updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/production-activation.mjs scripts/release-readiness.mjs scripts/release-readiness.test.mjs scripts/production-activation.test.mjs package.json
          git diff --cached --quiet || git commit -m "Align activation checks with 21 migrations"
          git push origin HEAD:feature/production-migration-inventory-v1
