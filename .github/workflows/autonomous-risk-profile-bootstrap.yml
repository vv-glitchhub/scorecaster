name: Scorecaster Autonomous Risk Profile Bootstrap

on:
  push:
    branches: [agent/autonomous-risk-profile-v1]

permissions:
  contents: write

jobs:
  patch-worker:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/autonomous-risk-profile-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic worker patch
        run: node scripts/apply-autonomous-risk-profile-worker-patch.mjs
      - name: Verify focused contract before commit
        run: node --test scripts/autonomous-risk-profile-v1.test.mjs
      - name: Remove one-time bootstrap files
        run: rm .github/workflows/autonomous-risk-profile-bootstrap.yml scripts/apply-autonomous-risk-profile-worker-patch.mjs
      - name: Commit patched worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Apply autonomous Agent risk profile end to end"
          git push origin HEAD:agent/autonomous-risk-profile-v1
