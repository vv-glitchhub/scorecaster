name: Scorecaster Pro Bettor Mode V2

on:
  pull_request:
    paths:
      - "lib/pro-bettor-policy-v1.mjs"
      - "lib/settings-storage.js"
      - "app/pro/**"
      - "app/api/agent/portfolio/route.js"
      - "app/components/ProfessionalPreferenceControls.jsx"
      - "app/components/ProfessionalPreferencesProvider.jsx"
      - "app/components/AppShell.jsx"
      - "scripts/pro-bettor-policy-v1.test.mjs"
      - ".github/workflows/pro-bettor-mode-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pro-bettor-mode-v2:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --silent

      - name: Professional bettor quality policy regression
        run: node scripts/pro-bettor-policy-v1.test.mjs

      - name: Agent risk regression
        run: node scripts/agent-v9.test.mjs

      - name: Repository secret boundary
        run: npm run security:check

      - name: Production build
        run: npm run build
