name: Scorecaster Autonomous Risk Order Fix Bootstrap

on:
  push:
    branches: [agent/autonomous-risk-profile-v1]

permissions:
  contents: write

jobs:
  fix-order:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/autonomous-risk-profile-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply canonical migration order fix
        run: node scripts/apply-autonomous-risk-order-fix.mjs
      - name: Verify release audit
        run: node scripts/release-readiness.mjs
      - name: Verify migration and release regressions
        run: node --test scripts/release-readiness.test.mjs scripts/migration-inventory.test.mjs scripts/migration-release-status.test.mjs scripts/autonomous-risk-profile-v1.test.mjs
      - name: Verify migration inventory
        run: node scripts/migration-inventory.mjs --check
      - name: Remove one-time bootstrap files
        run: rm .github/workflows/autonomous-risk-order-fix-bootstrap.yml scripts/apply-autonomous-risk-order-fix.mjs
      - name: Commit dependency-safe order
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Preserve autonomous hard-cap migration order"
          git push origin HEAD:agent/autonomous-risk-profile-v1
