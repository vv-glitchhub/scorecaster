name: Scorecaster CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: https://scorecaster-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_scorecaster_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --silent

      - name: Secret and repository security check
        run: npm run security:check

      - name: Release Readiness repository audit
        run: |
          set -o pipefail
          npm run release:audit 2>&1 | tee release-readiness-audit.log

      - name: API security regression tests
        run: npm run test:security

      - name: Market consensus regression tests
        run: npm run test:model

      - name: Paper settlement regression tests
        run: npm run test:settlement

      - name: Settlement Monitor V1 tests
        run: |
          set -o pipefail
          npm run test:settlement-monitor 2>&1 | tee settlement-monitor.log

      - name: Operations Dashboard V1 tests
        run: |
          set -o pipefail
          npm run test:operations 2>&1 | tee operations-dashboard.log

      - name: Release Readiness V1 tests
        run: |
          set -o pipefail
          npm run test:release-readiness 2>&1 | tee release-readiness.log

      - name: Production Activation V1 tests
        run: |
          set -o pipefail
          npm run test:production-activation 2>&1 | tee production-activation.log

      - name: Autonomous Paper Agent V1 tests
        run: |
          set -o pipefail
          npm run test:autonomous-agent 2>&1 | tee autonomous-agent.log

      - name: Betting Agent and Simulator regression tests
        run: npm run test:apps

      - name: Agent V9 adversarial portfolio tests
        run: |
          set -o pipefail
          npm run test:agent-v9 2>&1 | tee agent-v9.log

      - name: Agent V10 grounded explanation tests
        run: |
          set -o pipefail
          npm run test:agent-v10 2>&1 | tee agent-v10.log

      - name: Signed Agent decision and mobile AI tests
        run: |
          set -o pipefail
          npm run test:agent-ticket 2>&1 | tee agent-ticket.log

      - name: Agent V11 self-learning model lab tests
        run: |
          set -o pipefail
          npm run test:agent-v11 2>&1 | tee agent-v11.log

      - name: Watchlist and verified alert tests
        run: |
          set -o pipefail
          npm run test:watchlist 2>&1 | tee watchlist.log

      - name: Watchlist Monitor V1 tests
        run: |
          set -o pipefail
          npm run test:watchlist-monitor 2>&1 | tee watchlist-monitor.log

      - name: Alert Inbox tests
        run: |
          set -o pipefail
          npm run test:alert-inbox 2>&1 | tee alert-inbox.log

      - name: Notification Registry tests
        run: |
          set -o pipefail
          npm run test:notification-registry 2>&1 | tee notification-registry.log

      - name: Notification Delivery V1 tests
        run: |
          set -o pipefail
          npm run test:notification-delivery 2>&1 | tee notification-delivery.log

      - name: Market Timeline V1 tests
        run: |
          set -o pipefail
          npm run test:market-timeline 2>&1 | tee market-timeline.log

      - name: Trusted intelligence evidence tests
        run: |
          set -o pipefail
          npm run test:intelligence 2>&1 | tee intelligence.log

      - name: Team-attributed Sports Intelligence V1 tests
        run: |
          set -o pipefail
          npm run test:sports-intelligence 2>&1 | tee sports-intelligence.log

      - name: Provider firewall tests
        run: |
          set -o pipefail
          npm run test:provider-firewall 2>&1 | tee provider-firewall.log

      - name: Form and Rest shadow-model tests
        run: |
          set -o pipefail
          npm run test:form-rest 2>&1 | tee form-rest-shadow.log

      - name: Event Detail V1 tests
        run: |
          set -o pipefail
          npm run test:event-detail 2>&1 | tee event-detail.log

      - name: Decision Diagnostics V1 tests
        run: |
          set -o pipefail
          npm run test:diagnostics 2>&1 | tee decision-diagnostics.log

      - name: Easy-use navigation and onboarding tests
        run: |
          set -o pipefail
          npm run test:easy-use 2>&1 | tee easy-use.log

      - name: Finnish English Spanish coverage tests
        run: |
          set -o pipefail
          npm run test:i18n 2>&1 | tee i18n.log

      - name: Live fixture integrity tests
        run: |
          set -o pipefail
          npm run test:fixtures 2>&1 | tee fixture-integrity.log

      - name: Build
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build.log

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scorecaster-diagnostics-${{ github.run_id }}
          path: |
            release-readiness-audit.log
            release-readiness.log
            production-activation.log
            autonomous-agent.log
            settlement-monitor.log
            operations-dashboard.log
            agent-v9.log
            agent-v10.log
            agent-ticket.log
            agent-v11.log
            watchlist.log
            watchlist-monitor.log
            alert-inbox.log
            notification-registry.log
            notification-delivery.log
            market-timeline.log
            intelligence.log
            sports-intelligence.log
            provider-firewall.log
            form-rest-shadow.log
            event-detail.log
            decision-diagnostics.log
            easy-use.log
            i18n.log
            fixture-integrity.log
            build.log
          if-no-files-found: ignore
          retention-days: 7
