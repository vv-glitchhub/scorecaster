permissions:
  contents: read

jobs:
  model-factory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: https://scorecaster-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_scorecaster_ci_placeholder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --silent

      - name: Model Factory regression tests
        run: node --test scripts/model-lineage-guard-v1.test.mjs scripts/model-performance-evidence-v1.test.mjs scripts/model-factory-v1.test.mjs scripts/historical-rating-shadow-v1.test.mjs scripts/nhl-xg-goalie-shadow-v1.test.mjs scripts/soccer-xg-poisson-shadow-v1.test.mjs scripts/basketball-efficiency-shadow-v1.test.mjs scripts/basketball-model-factory-v1.test.mjs scripts/basketball-transparency-registry-v1.test.mjs scripts/advanced-model-holdout-v1.test.mjs scripts/sports-analytics-provider-contract-v2.test.mjs scripts/event-model-audit-ui.test.mjs scripts/advanced-signal-readiness-v1.test.mjs

      - name: Existing Feature Ensemble regressions
        run: npm run test:feature-ensemble

      - name: Open transparency regressions
        run: npm run test:transparency

      - name: Security check
        run: npm run security:check

      - name: Production build
        run: npm run build
