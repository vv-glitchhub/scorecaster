name: Scorecaster Intelligence V4 CI

on:
  pull_request:
    paths:
      - "app/api/intelligence-v4/**"
      - "app/intelligence-v4/**"
      - "lib/intelligence-v4.mjs"
      - "scripts/intelligence-v4.test.mjs"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Intelligence V4 regression tests
        run: npm run test:intelligence-v4
      - name: Production build
        run: npm run build
