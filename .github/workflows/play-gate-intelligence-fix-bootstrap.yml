name: Scorecaster PLAY Gate Intelligence Fix Bootstrap

on:
  push:
    branches: [agent/play-gate-intelligence-fix-v1]
    paths:
      - ".github/workflows/play-gate-intelligence-fix-bootstrap.yml"

permissions:
  contents: write

jobs:
  patch-copy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/play-gate-intelligence-fix-v1
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Align diagnostics copy with neutral missing-evidence policy
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/diagnostics/DiagnosticsClient.jsx")
          text = path.read_text()
          old = '''    "intelligence-safety-downgrade": {
      title: tr({ fi: "Evidenssiportti alensi PLAYn", en: "Evidence gate downgraded PLAY", es: "La evidencia rebajó PLAY" }),
      description: tr({ fi: "Markkinaraja täyttyi, mutta riippumaton evidenssi ei sallinut PLAY-päätöstä.", en: "The market threshold passed, but independent evidence did not permit PLAY.", es: "El mercado pasó, pero la evidencia no permitió PLAY." }),
      tone: "yellow"
    },
    "intelligence-not-verified": {
      title: tr({ fi: "Riippumatonta evidenssiä ei ole varmennettu", en: "Independent evidence is not verified", es: "La evidencia no está verificada" }),
      description: tr({ fi: "Markkina voi olla vahva, mutta PLAY vaatii varmennetun evidenssitilan.", en: "The market may be strong, but PLAY requires verified evidence readiness.", es: "El mercado puede ser fuerte, pero PLAY exige evidencia verificada." }),
      tone: "yellow"
    },
'''
          new = '''    "intelligence-safety-downgrade": {
      title: tr({ fi: "Evidenssiportti alensi PLAYn", en: "Evidence gate downgraded PLAY", es: "La evidencia rebajó PLAY" }),
      description: tr({ fi: "Markkinaraja täyttyi, mutta varmennettu negatiivinen signaali tai ratkaisematon evidenssiristiriita esti PLAYn.", en: "The market threshold passed, but verified negative intelligence or an unresolved evidence conflict blocked PLAY.", es: "El mercado pasó, pero una señal negativa verificada o un conflicto de evidencia bloqueó PLAY." }),
      tone: "yellow"
    },
    "intelligence-negative-verified": {
      title: tr({ fi: "Varmennettu negatiivinen signaali", en: "Verified negative intelligence", es: "Señal negativa verificada" }),
      description: tr({ fi: "Joukkueeseen kohdistuva varmennettu riippumaton evidenssi ylitti negatiivisen downgrade-rajan.", en: "Verified team-attributed independent evidence crossed the negative downgrade threshold.", es: "La evidencia independiente verificada del equipo superó el umbral negativo." }),
      tone: "yellow"
    },
'''
          if old not in text:
              raise SystemExit("diagnostics copy anchor missing")
          path.write_text(text.replace(old, new, 1))

      - name: Install dependencies
        run: npm install --no-audit --no-fund --silent

      - name: Focused regressions
        run: node --test scripts/sports-intelligence-v1.test.mjs scripts/decision-diagnostics.test.mjs

      - name: Commit diagnostics copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/diagnostics/DiagnosticsClient.jsx
          git diff --cached --quiet && exit 0
          git commit -m "Align PLAY diagnostics with neutral missing evidence"
          git push origin HEAD:agent/play-gate-intelligence-fix-v1
