name: Scorecaster Calibration Settlement

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/calibration-settlement.yml"
      - "app/api/internal/shadow-candidate-settlement/**"
      - "app/api/internal/calibration-settlement/**"
      - "app/api/internal/shadow-learning/**"
      - "lib/shadow-learning-worker.js"
      - "lib/shadow-learning-config.js"
      - "lib/calibration-settlement-activation.mjs"
      - "supabase/scorecaster_shadow_candidate_*.sql"
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecaster-calibration-settlement
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SCORECASTER_URL: ${{ vars.SCORECASTER_PRODUCTION_URL || 'https://scorecaster.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate worker secret
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi

      - name: Settle rejected shadow candidates
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/shadow-candidate-settlement"

      - name: Build trusted CLV and calibration observations
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/calibration-settlement"

      - name: Run shadow learning cycle
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/shadow-learning"

      - name: Read redacted Calibration Lab health
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 60 \
            "$SCORECASTER_URL/api/calibration/health"
