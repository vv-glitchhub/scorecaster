name: Scorecaster Notification Delivery

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecaster-notification-delivery
  cancel-in-progress: false

jobs:
  deliver:
    if: ${{ vars.SCORECASTER_NOTIFICATION_DELIVERY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate delivery configuration
        env:
          DELIVERY_URL: ${{ secrets.SCORECASTER_NOTIFICATION_DELIVERY_URL }}
          CRON_SECRET: ${{ secrets.SCORECASTER_CRON_SECRET }}
        run: |
          set -euo pipefail
          test -n "$DELIVERY_URL"
          test -n "$CRON_SECRET"
          case "$DELIVERY_URL" in
            https://*) ;;
            *) echo "Delivery URL must use HTTPS" >&2; exit 1 ;;
          esac
          test "${#CRON_SECRET}" -ge 16

      - name: Run bounded delivery cycle
        env:
          DELIVERY_URL: ${{ secrets.SCORECASTER_NOTIFICATION_DELIVERY_URL }}
          CRON_SECRET: ${{ secrets.SCORECASTER_CRON_SECRET }}
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            --max-time 55 \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            --header "Accept: application/json" \
            "${DELIVERY_URL%/}/api/internal/notification-delivery"
