name: Scorecaster Transparent 1X2 V2 Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  transparent-1x2-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
      NEXT_PUBLIC_SUPABASE_URL: https://scorecaster-ci.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_scorecaster_ci_placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --silent

      - name: Transparent 1X2 V2 validation regressions
        run: node --test scripts/transparent-1x2-v2-validation.test.mjs scripts/transparent-1x2-v2-failclosed.test.mjs

      - name: Immutable chronology-safe evaluation package regressions
        run: node --test scripts/transparent-1x2-evaluation-package.test.mjs scripts/transparent-1x2-evaluation-package-failclosed.test.mjs

      - name: Paired baseline challenger evidence regressions
        run: node --test scripts/transparent-1x2-paired-evidence.test.mjs scripts/transparent-1x2-paired-evidence-failclosed.test.mjs

      - name: Existing Transparent 1X2 baseline regressions
        run: node --test scripts/transparent-1x2-baseline.test.mjs

      - name: Calibration and leakage regressions
        run: node --test scripts/calibration-lab-v1.test.mjs

      - name: API security regressions
        run: npm run test:security

      - name: Secret and repository security check
        run: npm run security:check

      - name: Production build
        run: npm run build
