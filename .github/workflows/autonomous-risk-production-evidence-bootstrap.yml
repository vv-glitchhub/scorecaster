name: Scorecaster Autonomous Risk Production Evidence Bootstrap

on:
  push:
    branches: [agent/autonomous-risk-production-evidence-v1]

permissions:
  contents: write

jobs:
  build-evidence:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/autonomous-risk-production-evidence-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build exact 13-route evidence contract
        run: node scripts/apply-autonomous-risk-production-evidence-v1.mjs
      - name: Verify protected API contract and retained evidence
        run: |
          node scripts/protected-api-contract-audit.mjs
          node --test scripts/protected-api-contract-audit.test.mjs scripts/protected-api-production-evidence.test.mjs
          node scripts/release-readiness.mjs
      - name: Remove one-time bootstrap
        run: rm .github/workflows/autonomous-risk-production-evidence-bootstrap.yml scripts/apply-autonomous-risk-production-evidence-v1.mjs
      - name: Commit trusted evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Retain 13-route production auth evidence"
          git push origin HEAD:agent/autonomous-risk-production-evidence-v1
