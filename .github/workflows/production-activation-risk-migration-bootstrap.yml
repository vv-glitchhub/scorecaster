name: Scorecaster Production Activation Risk Migration Bootstrap

on:
  push:
    branches: [agent/autonomous-risk-profile-v1]

permissions:
  contents: write

jobs:
  update-activation:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/autonomous-risk-profile-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Update activation migration contract
        run: node scripts/apply-production-activation-risk-migration-fix.mjs
      - name: Verify activation and release contracts
        run: |
          node --test scripts/production-activation.test.mjs scripts/release-readiness.test.mjs scripts/migration-inventory.test.mjs scripts/autonomous-risk-profile-v1.test.mjs
          node scripts/release-readiness.mjs
          node scripts/migration-inventory.mjs --check
      - name: Remove one-time bootstrap files
        run: rm .github/workflows/production-activation-risk-migration-bootstrap.yml scripts/apply-production-activation-risk-migration-fix.mjs
      - name: Commit activation update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Include autonomous risk migration in production activation"
          git push origin HEAD:agent/autonomous-risk-profile-v1
