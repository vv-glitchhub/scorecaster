name: Scorecaster Market Microstructure

on:
  push:
    branches: [main]
    paths:
      - "lib/market-microstructure-v2.mjs"
      - "lib/market-microstructure-activation.mjs"
      - "app/api/internal/market-microstructure/**"
      - "app/api/market-microstructure/**"
      - "scripts/market-microstructure-v2.test.mjs"
      - "supabase/scorecaster_market_microstructure_v2.sql"
      - ".github/workflows/market-microstructure.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecaster-market-microstructure
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SCORECASTER_URL: ${{ vars.SCORECASTER_PRODUCTION_URL || 'https://scorecaster.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate worker secret
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi

      - name: Wait for exact production commit
        if: github.event_name == 'push'
        env:
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            observed="$(curl --silent --show-error --max-time 15 "${SCORECASTER_URL}/api/health" \
              | python3 -c 'import json,sys; print(json.load(sys.stdin).get("commit", ""))' 2>/dev/null || true)"
            if [[ "$observed" == "$TARGET_SHA" ]]; then
              echo "Exact production commit is live: ${TARGET_SHA:0:8}"
              exit 0
            fi
            echo "Waiting for production target=${TARGET_SHA:0:8} observed=${observed:0:8}"
            sleep 15
          done
          echo "Production did not reach the exact target commit in time" >&2
          exit 1

      - name: Capture normalized provider prices
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/market-microstructure-response.json"
          http_code="$(curl --silent --show-error \
            --retry 2 \
            --max-time 150 \
            --output "$report" \
            --write-out "%{http_code}" \
            -H "Accept: application/json" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/market-microstructure")"

          HTTP_CODE="$http_code" REPORT_PATH="$report" node <<'NODE'
          const fs = require('node:fs');
          const code = Number(process.env.HTTP_CODE || 0);
          let payload = null;
          try { payload = JSON.parse(fs.readFileSync(process.env.REPORT_PATH, 'utf8')); } catch {}
          const safe = {
            httpStatus: code,
            ok: payload?.ok === true,
            version: payload?.version || null,
            status: payload?.status || null,
            sports: Array.isArray(payload?.sports) ? payload.sports : [],
            markets: Array.isArray(payload?.markets) ? payload.markets : [],
            events: payload?.events ?? null,
            normalizedRecords: payload?.normalizedRecords ?? null,
            stored: payload?.stored ?? null,
            rejected: payload?.rejected ?? null,
            ignoredPostStartGames: payload?.ignoredPostStartGames ?? null,
            probabilityChanged: payload?.probabilityChanged ?? null,
            realMoneyExecution: payload?.realMoneyExecution ?? null,
            paperOnly: payload?.paperOnly ?? null,
          };
          console.log(JSON.stringify(safe));

          const baseSafe = code === 200 && payload?.ok === true && payload?.paperOnly === true && payload?.probabilityChanged === false && payload?.realMoneyExecution === false;
          if (!baseSafe) process.exit(1);

          if (process.env.GITHUB_EVENT_NAME === 'push') {
            const markets = new Set(Array.isArray(payload?.markets) ? payload.markets : []);
            const sports = new Set(Array.isArray(payload?.sports) ? payload.sports : []);
            const requiredMarkets = ['h2h', 'spreads', 'totals'];
            const ownedFootball = ['soccer_epl', 'soccer_spain_la_liga', 'soccer_italy_serie_a', 'soccer_germany_bundesliga', 'soccer_france_ligue_one'];
            if (payload?.status !== 'success') throw new Error(`Post-deploy market proof requires success, got ${payload?.status}`);
            if (Number(payload?.rejected || 0) !== 0) throw new Error(`Post-deploy market proof rejected ${payload?.rejected} rows`);
            if (!requiredMarkets.every((market) => markets.has(market))) throw new Error('Post-deploy market proof is missing a required market');
            if (!ownedFootball.every((sport) => sports.has(sport))) throw new Error('Post-deploy market proof is missing an owned-football league');
          }
          NODE

      - name: Read redacted market health
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 60 \
            "$SCORECASTER_URL/api/market-microstructure/health"
