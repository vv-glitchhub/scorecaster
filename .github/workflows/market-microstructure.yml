name: Scorecaster Market Microstructure

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-microstructure.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecaster-market-microstructure
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SCORECASTER_URL: ${{ vars.SCORECASTER_PRODUCTION_URL || 'https://scorecaster.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate worker secret
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi

      - name: Capture normalized provider prices
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/market-microstructure"

      - name: Read redacted market health
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 60 \
            "$SCORECASTER_URL/api/market-microstructure/health"
