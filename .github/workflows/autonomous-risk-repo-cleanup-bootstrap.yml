name: Scorecaster Autonomous Risk Repo Cleanup Bootstrap

on:
  push:
    branches: [agent/autonomous-risk-profile-v1]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/autonomous-risk-profile-v1
          fetch-depth: 0
      - name: Remove accidentally tracked mobile dependencies
        run: git rm -r --ignore-unmatch mobile/node_modules
      - name: Lock dependency directories out of git
        run: |
          cat > .gitignore <<'EOF'
          node_modules/
          mobile/node_modules/
          .next/
          mobile/.expo/
          mobile/dist/
          coverage/
          *.log
          .env
          .env.*
          !.env.example
          EOF
      - name: Remove one-time cleanup workflow
        run: rm .github/workflows/autonomous-risk-repo-cleanup-bootstrap.yml
      - name: Commit repository cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Keep generated dependencies out of Scorecaster source"
          git push origin HEAD:agent/autonomous-risk-profile-v1
