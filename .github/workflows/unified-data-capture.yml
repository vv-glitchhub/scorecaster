name: Scorecaster Unified Data Capture

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SCORECASTER_URL: ${{ vars.SCORECASTER_PRODUCTION_URL || 'https://scorecaster.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate unified data worker secret
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi

      - name: Capture event ledgers and closing prices
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/unified-data"

      - name: Capture normalized multi-sport analytics
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/sports-analytics"
