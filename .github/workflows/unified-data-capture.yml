name: Scorecaster Unified Data Capture

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecaster-data-pipeline
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SCORECASTER_URL: ${{ vars.SCORECASTER_PRODUCTION_URL || 'https://scorecaster.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate unified data worker secret
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi

      - name: Capture event ledgers and closing prices when stale
        id: unified
        run: |
          status=$(curl --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -o /tmp/unified.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/unified-data?skipIfFreshMinutes=15")
          if [ "$status" != "200" ]; then
            echo "Unified Data worker failed with HTTP $status"
            exit 1
          fi
          if [ "$(jq -r '.ok // false' /tmp/unified.json)" != "true" ]; then
            echo "Unified Data worker returned ok=false"
            exit 1
          fi
          skipped=$(jq -r '.skipped // false' /tmp/unified.json)
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          if [ "$skipped" = "true" ]; then
            echo "Fallback capture skipped because post-collector evidence is already fresh."
          else
            echo "Fallback schedule captured fresh Unified Data."
          fi

      - name: Capture normalized multi-sport analytics
        if: steps.unified.outputs.skipped != 'true'
        run: |
          status=$(curl --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -o /tmp/sports-analytics.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/sports-analytics")
          if [ "$status" != "200" ]; then
            echo "Sports Analytics worker failed with HTTP $status"
            exit 1
          fi
          if [ "$(jq -r '.ok // false' /tmp/sports-analytics.json)" != "true" ]; then
            echo "Sports Analytics worker returned ok=false"
            exit 1
          fi
          echo "Sports Analytics completed without exposing the worker payload."
