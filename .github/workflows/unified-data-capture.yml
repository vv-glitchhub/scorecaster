name: Scorecaster Unified Data Capture

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecaster-data-pipeline
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SCORECASTER_URL: ${{ vars.SCORECASTER_PRODUCTION_URL || 'https://scorecaster.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate unified data worker secret
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi

      - name: Check Unified Data freshness
        id: freshness
        shell: bash
        run: |
          status=$(curl --silent --show-error \
            --retry 1 \
            --max-time 30 \
            -o /tmp/freshness.json \
            -w "%{http_code}" \
            "$SCORECASTER_URL/api/unified-data/freshness" || true)
          required=true
          blocked=false
          if [ -s /tmp/freshness.json ]; then
            unavailable=$(jq -r '.dataStoreUnavailable // false' /tmp/freshness.json 2>/dev/null || echo false)
            if [ "$unavailable" = "true" ]; then
              blocked=true
              required=false
            elif [ "$status" = "200" ]; then
              ok=$(jq -r '.ok // false' /tmp/freshness.json 2>/dev/null || echo false)
              if [ "$ok" = "true" ]; then
                required=$(jq -r '.protectedWorkerRequired // true' /tmp/freshness.json 2>/dev/null || echo true)
              fi
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          echo "blocked=$blocked" >> "$GITHUB_OUTPUT"
          if [ "$blocked" = "true" ]; then
            echo "Unified Data store is unavailable; provider fanout is suppressed."
          elif [ "$required" = "true" ]; then
            echo "Fallback capture is required."
          else
            echo "Post-collector Unified Data is still fresh; fallback provider acquisition is skipped."
          fi

      - name: Fail closed while Unified Data store is unavailable
        if: steps.freshness.outputs.blocked == 'true'
        run: |
          echo "Unified Data capture cannot proceed because the production data store is unavailable."
          exit 1

      - name: Capture event ledgers and closing prices
        if: steps.freshness.outputs.required == 'true' && steps.freshness.outputs.blocked != 'true'
        run: |
          status=$(curl --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -o /tmp/unified.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/unified-data")
          if [ "$status" != "200" ]; then
            echo "Unified Data worker failed with HTTP $status"
            exit 1
          fi
          if [ "$(jq -r '.ok // false' /tmp/unified.json)" != "true" ]; then
            echo "Unified Data worker returned ok=false"
            exit 1
          fi
          echo "Fallback schedule captured fresh Unified Data."

      - name: Capture normalized multi-sport analytics
        if: steps.freshness.outputs.required == 'true' && steps.freshness.outputs.blocked != 'true'
        run: |
          status=$(curl --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -o /tmp/sports-analytics.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/sports-analytics")
          if [ "$status" != "200" ]; then
            echo "Sports Analytics worker failed with HTTP $status"
            exit 1
          fi
          if [ "$(jq -r '.ok // false' /tmp/sports-analytics.json)" != "true" ]; then
            echo "Sports Analytics worker returned ok=false"
            exit 1
          fi
          echo "Sports Analytics completed without exposing the worker payload."
