name: Scorecaster Collector

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecaster-data-pipeline
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SCORECASTER_URL: ${{ vars.SCORECASTER_PRODUCTION_URL || 'https://scorecaster.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate collector secret
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi

      - name: Collect rights-approved sports data
        run: |
          status=$(curl --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -o /tmp/collector.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/collector")
          if [ "$status" != "200" ]; then
            if [ "$(jq -r '.errorCode // empty' /tmp/collector.json 2>/dev/null || true)" = "supabase-service-restricted" ]; then
              echo "::error::Collector blocked by Supabase Fair Use (HTTP 402); check organization billing and database quota."
            fi
            echo "Collector failed with HTTP $status"
            # Only allow fixed stage identifiers; never print the worker's
            # response body or arbitrary database/provider error strings.
            stage=$(jq -r '.failureStage // empty' /tmp/collector.json 2>/dev/null || true)
            case "$stage" in
              create-run|acquire-data|external-collector|save-records|finish-run)
                echo "::error::Collector failed at stage $stage"
                ;;
            esac
            exit 1
          fi
          if [ "$(jq -r '.ok // false' /tmp/collector.json)" != "true" ]; then
            echo "Collector returned ok=false"
            exit 1
          fi
          echo "Collector completed without exposing the worker payload."

      - name: Check Unified Data freshness
        id: freshness
        shell: bash
        run: |
          status=$(curl --silent --show-error \
            --retry 1 \
            --max-time 30 \
            -o /tmp/freshness.json \
            -w "%{http_code}" \
            "$SCORECASTER_URL/api/unified-data/freshness" || true)
          required=true
          if [ "$status" = "503" ] && [ "$(jq -r '.errorCode // empty' /tmp/freshness.json 2>/dev/null || true)" = "supabase-service-restricted" ]; then
            echo "::error::Supabase Fair Use restriction (HTTP 402); protected acquisition is blocked."
            exit 1
          fi
          if [ "$status" = "200" ] && [ -s /tmp/freshness.json ]; then
            ok=$(jq -r '.ok // false' /tmp/freshness.json 2>/dev/null || echo false)
            if [ "$ok" = "true" ]; then
              required=$(jq -r '.protectedWorkerRequired // true' /tmp/freshness.json 2>/dev/null || echo true)
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
          if [ "$required" = "true" ]; then
            echo "Unified Data capture is stale or freshness could not be verified."
          else
            echo "Unified Data capture is already fresh; provider acquisition will be skipped."
          fi

      - name: Capture fresh Unified Data after collection
        if: steps.freshness.outputs.required == 'true'
        run: |
          status=$(curl --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -o /tmp/unified.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/unified-data")
          if [ "$status" != "200" ]; then
            echo "Unified Data worker failed with HTTP $status"
            exit 1
          fi
          if [ "$(jq -r '.ok // false' /tmp/unified.json)" != "true" ]; then
            echo "Unified Data worker returned ok=false"
            exit 1
          fi
          echo "Unified Data captured fresh post-collector evidence."

      - name: Capture normalized multi-sport analytics
        run: |
          status=$(curl --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -o /tmp/sports-analytics.json \
            -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/sports-analytics")
          if [ "$status" != "200" ]; then
            echo "Sports Analytics worker failed with HTTP $status"
            exit 1
          fi
          if [ "$(jq -r '.ok // false' /tmp/sports-analytics.json)" != "true" ]; then
            echo "Sports Analytics worker returned ok=false"
            exit 1
          fi
          echo "Sports Analytics completed without exposing the worker payload."

      - name: Verify collector health
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 60 \
            "$SCORECASTER_URL/api/collector/health" >/dev/null
          echo "Collector health check passed."
