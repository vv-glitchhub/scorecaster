name: Scorecaster Collector

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecaster-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      SCORECASTER_URL: ${{ vars.SCORECASTER_PRODUCTION_URL || 'https://scorecaster.vercel.app' }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Validate collector secret
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not configured"
            exit 1
          fi

      - name: Collect rights-approved sports data
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/collector"

      - name: Verify collector health
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 60 \
            "$SCORECASTER_URL/api/collector/health"

      - name: Capture unified event ledgers
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/unified-data"

      - name: Capture normalized multi-sport analytics
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 150 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SCORECASTER_URL/api/internal/sports-analytics"
