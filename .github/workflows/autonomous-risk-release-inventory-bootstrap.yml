name: Scorecaster Autonomous Risk Release Inventory Bootstrap

on:
  push:
    branches: [agent/autonomous-risk-profile-v1]

permissions:
  contents: write

jobs:
  patch-release-inventory:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/autonomous-risk-profile-v1
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic release inventory patch
        run: node scripts/apply-autonomous-risk-release-inventory-patch.mjs
      - name: Verify migration inventory
        run: node scripts/migration-inventory.mjs --check
      - name: Verify migration inventory tests
        run: node --test scripts/migration-inventory.test.mjs scripts/migration-release-status.test.mjs
      - name: Verify autonomous risk profile tests
        run: node --test scripts/autonomous-risk-profile-v1.test.mjs
      - name: Remove one-time bootstrap files
        run: rm .github/workflows/autonomous-risk-release-inventory-bootstrap.yml scripts/apply-autonomous-risk-release-inventory-patch.mjs
      - name: Commit release inventory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Track autonomous risk profile in production release evidence"
          git push origin HEAD:agent/autonomous-risk-profile-v1
