name: WP91 Patch Migration Manifest

on:
  push:
    branches:
      - feature/production-migration-inventory-v1
    paths:
      - .github/workflows/wp91-manifest-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/production-migration-inventory-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add missing migrations to canonical order
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises";
          const path = "config/release-readiness.json";
          const config = JSON.parse(await readFile(path, "utf8"));
          const migrations = config.supabaseMigrations;
          const insertAfter = (anchor, value) => {
            if (migrations.includes(value)) return;
            const index = migrations.indexOf(anchor);
            if (index < 0) throw new Error(`Missing anchor ${anchor}`);
            migrations.splice(index + 1, 0, value);
          };
          insertAfter("supabase/scorecaster_auth_cloud.sql", "supabase/scorecaster_community_feed_v1.sql");
          insertAfter("supabase/scorecaster_collector_v1.sql", "supabase/scorecaster_ai_intelligence_v1.sql");
          if (migrations.length !== 21) throw new Error(`Expected 21 migrations, received ${migrations.length}`);
          await writeFile(path, `${JSON.stringify(config, null, 2)}\n`, "utf8");
          NODE
      - name: Commit manifest correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/release-readiness.json
          git diff --cached --quiet || git commit -m "Fix canonical production migration order"
          git push origin HEAD:feature/production-migration-inventory-v1
